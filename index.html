<!-- SalesCRM v2.1 build:20260520 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SalesCRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg-primary:#ffffff; --bg-secondary:#f5f5f4; --bg-tertiary:#f0efed;
  --text-primary:#1a1a1a; --text-secondary:#6b6b6b; --text-tertiary:#9e9e9e;
  --border:rgba(0,0,0,0.1); --border-md:rgba(0,0,0,0.18);
  --accent:#185FA5; --accent-light:#E6F1FB; --accent-dark:#0C447C;
  --radius-md:8px; --radius-lg:12px;
}
[data-theme="dark"] {
  --bg-primary:#1e1e1e; --bg-secondary:#2a2a2a; --bg-tertiary:#161616;
  --text-primary:#f0f0f0; --text-secondary:#aaaaaa; --text-tertiary:#666666;
  --border:rgba(255,255,255,0.1); --border-md:rgba(255,255,255,0.18);
  --accent-light:#0d2e50;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-tertiary);color:var(--text-primary);font-size:14px;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:210px;flex-shrink:0;background:var(--bg-primary);border-right:0.5px solid var(--border);display:flex;flex-direction:column}
.logo{padding:18px 16px 14px;font-weight:600;font-size:15px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:9px}
.logo-icon{width:28px;height:28px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon i{font-size:15px;color:#fff}
.nav-wrap{padding:8px;flex:1;overflow-y:auto}
.nav-section{padding:10px 8px 3px;font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;font-size:13px;cursor:pointer;color:var(--text-secondary);border-radius:var(--radius-md);transition:background .12s,color .12s;margin-bottom:1px}
.nav-item:hover{background:var(--bg-secondary);color:var(--text-primary)}
.nav-item.active{background:var(--accent-light);color:var(--accent-dark);font-weight:500}
.nav-item i{font-size:17px}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px;font-weight:600}
.sidebar-footer{padding:12px 14px;border-top:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.storage-info{display:flex;align-items:center;gap:6px;font-size:11px;color:#3B6D11}
.storage-info i{font-size:14px;color:#639922}
.theme-btn{background:none;border:0.5px solid var(--border);border-radius:var(--radius-md);width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:background .12s}
.theme-btn:hover{background:var(--bg-secondary)}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--bg-primary);border-bottom:0.5px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.page-title{font-weight:600;font-size:15px}
.topbar-right{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-md);border:0.5px solid var(--border-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;cursor:pointer;transition:background .12s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg-secondary)}
.btn i{font-size:15px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn-danger{background:#FCEBEB;color:#791F1F;border-color:#F09595}
.btn-danger:hover{background:#F7C1C1}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.card-title{font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--bg-secondary);border-radius:var(--radius-md);padding:14px 16px}
.metric-label{font-size:12px;color:var(--text-secondary);margin-bottom:5px}
.metric-value{font-size:22px;font-weight:600}
.metric-sub{font-size:11px;color:var(--text-tertiary);margin-top:3px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}

/* Pipeline */
.pipe-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sp-filter-wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sp-filter-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;border:0.5px solid var(--border-md);background:var(--bg-primary);color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .12s;font-family:inherit;white-space:nowrap}
.sp-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.sp-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sp-avatar-sm{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}
.pipeline-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;min-height:200px}
.pipe-col{flex:0 0 215px;display:flex;flex-direction:column;gap:8px}
.pipe-col.drag-over .pipe-body{outline:2px dashed var(--accent);outline-offset:3px;background:var(--accent-light);border-radius:var(--radius-md)}
.pipe-header{font-size:12px;font-weight:500;padding:7px 10px;border-radius:var(--radius-md);background:var(--bg-secondary);display:flex;justify-content:space-between;align-items:center;gap:4px;min-height:34px}
.pipe-header-left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.pipe-stage-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;cursor:pointer}
.pipe-stage-dot:hover{transform:scale(1.3)}
.pipe-stage-name{color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.pipe-count{font-size:10px;background:var(--bg-primary);border-radius:99px;padding:1px 6px;border:0.5px solid var(--border);flex-shrink:0}
.pipe-edit-btns{display:flex;gap:1px;opacity:0;transition:opacity .15s;flex-shrink:0}
.pipe-header:hover .pipe-edit-btns{opacity:1}
.pipe-btn{background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:3px 5px;border-radius:4px;font-size:12px;line-height:1;display:flex;align-items:center;transition:color .12s,background .12s}
.pipe-btn:hover{color:var(--text-primary);background:var(--bg-primary)}
.pipe-body{display:flex;flex-direction:column;gap:8px;min-height:32px;transition:all .15s}
.deal-card{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;cursor:grab;transition:border-color .15s,transform .1s,opacity .15s;user-select:none}
.deal-card:active{cursor:grabbing}
.deal-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.deal-card.dragging{opacity:.35;cursor:grabbing}
.deal-card.faded{opacity:.25}
.deal-name{font-size:12px;font-weight:500;margin-bottom:2px;line-height:1.4}
.deal-company{font-size:11px;color:var(--text-secondary);margin-bottom:6px}
.deal-sp-row{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.sp-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 6px;border-radius:99px;font-weight:500}
.deal-footer{display:flex;justify-content:space-between;align-items:center}
.deal-value{font-size:12px;font-weight:600;color:var(--accent)}
.deal-date{font-size:10px;color:var(--text-tertiary)}
.pipe-add-deal{border:0.5px dashed var(--border);border-radius:var(--radius-md);padding:7px;text-align:center;font-size:11px;color:var(--text-tertiary);cursor:pointer;transition:background .12s}
.pipe-add-deal:hover{background:var(--bg-secondary);color:var(--text-secondary)}
.pipe-new-stage-btn{flex:0 0 auto;display:flex;align-items:flex-start}
.new-stage-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:0.5px dashed var(--border);border-radius:var(--radius-md);background:none;color:var(--text-tertiary);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .12s;font-family:inherit}
.new-stage-btn:hover{background:var(--bg-secondary);color:var(--text-secondary);border-color:var(--border-md)}

/* Stage manager */
.stage-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:320px;overflow-y:auto}
.stage-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-secondary);border-radius:var(--radius-md);border:0.5px solid var(--border);cursor:default}
.drag-handle{cursor:grab;color:var(--text-tertiary);font-size:15px;flex-shrink:0;padding:2px}
.color-dot-btn{width:16px;height:16px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .12s}
.color-dot-btn:hover{border-color:var(--border-md);transform:scale(1.2)}
.stage-name-inp{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:var(--text-primary);font-family:inherit;padding:2px 0;border-bottom:1px solid transparent;transition:border-color .15s}
.stage-name-inp:focus{border-bottom-color:var(--accent)}
.stage-del-btn{background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:3px 5px;border-radius:4px;font-size:13px;display:flex;align-items:center;transition:color .12s}
.stage-del-btn:hover{color:#A32D2D}
.color-picker-popup{display:none;flex-wrap:wrap;gap:7px;padding:10px;background:var(--bg-primary);border:0.5px solid var(--border);border-radius:var(--radius-md);margin-top:4px;margin-left:40px}
.color-swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s,border-color .1s;flex-shrink:0}
.color-swatch:hover{transform:scale(1.25)}
.color-swatch.active{border-color:var(--text-primary)}

/* Salesperson list in modal */
.sp-list{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:260px;overflow-y:auto}
.sp-row{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg-secondary);border-radius:var(--radius-md);border:0.5px solid var(--border)}
.sp-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sp-name-inp{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:var(--text-primary);font-family:inherit;padding:2px 0;border-bottom:1px solid transparent;transition:border-color .15s}
.sp-name-inp:focus{border-bottom-color:var(--accent)}
.sp-del-btn{background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:3px 5px;border-radius:4px;font-size:13px;display:flex;align-items:center;transition:color .12s}
.sp-del-btn:hover{color:#A32D2D}
.sp-deal-count{font-size:10px;color:var(--text-tertiary);white-space:nowrap}

/* Contacts */
.contact-table{width:100%;border-collapse:collapse}
.contact-table th{font-size:11px;color:var(--text-tertiary);font-weight:500;text-align:left;padding:8px 14px;background:var(--bg-secondary);border-bottom:0.5px solid var(--border)}
.contact-table th:first-child{border-radius:var(--radius-md) 0 0 0}
.contact-table th:last-child{border-radius:0 var(--radius-md) 0 0}
.contact-table td{padding:10px 14px;border-bottom:0.5px solid var(--border);font-size:13px;vertical-align:middle}
.contact-table tr:last-child td{border-bottom:none}
.contact-table tr:hover td{background:var(--bg-secondary);cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}

/* Tasks */
.task-sec-title{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:10px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:0.5px solid var(--border);border-radius:var(--radius-md);background:var(--bg-primary);cursor:pointer;transition:background .1s;margin-bottom:8px}
.task-item:hover{background:var(--bg-secondary)}
.task-item.done{opacity:.5}
.task-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border-md);margin-top:1px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.task-check.on{background:var(--accent);border-color:var(--accent)}
.task-check.on i{font-size:11px;color:#fff}
.due-pill{font-size:11px;padding:2px 8px;border-radius:99px;margin-left:auto;flex-shrink:0}

/* Activity */
.act-item{display:flex;gap:12px;padding:11px 0;border-bottom:0.5px solid var(--border)}
.act-item:last-child{border-bottom:none}
.act-ico{width:32px;height:32px;border-radius:50%;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-ico i{font-size:15px;color:var(--text-secondary)}

/* Badges */
.badge{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.badge-lead{background:#FAEEDA;color:#633806}
.badge-prospect{background:#E6F1FB;color:#0C447C}
.badge-customer{background:#EAF3DE;color:#27500A}
.badge-churned{background:#FCEBEB;color:#791F1F}

/* Progress */
.prog-wrap{height:5px;background:var(--bg-secondary);border-radius:3px;margin-top:4px}
.prog-bar{height:5px;border-radius:3px;transition:width .4s}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--bg-primary);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:22px;width:460px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-weight:600;font-size:15px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.fg{margin-bottom:12px}
.fl{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:8px 11px;border:0.5px solid var(--border-md);border-radius:var(--radius-md);background:var(--bg-primary);color:var(--text-primary);font-size:13px;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
textarea{resize:vertical;min-height:72px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.empty{text-align:center;padding:40px;color:var(--text-tertiary);font-size:13px}
.save-notice{display:flex;align-items:center;gap:7px;font-size:12px;color:#3B6D11;background:#EAF3DE;padding:7px 12px;border-radius:var(--radius-md);margin-bottom:14px}
.save-notice i{font-size:14px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dl{font-size:11px;color:var(--text-secondary);margin-bottom:3px}
.dv{font-size:13px;font-weight:500}
.stage-sel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.stage-pill{font-size:11px;padding:4px 10px;border-radius:99px;cursor:pointer;border:1px solid transparent;transition:all .12s}
.stage-pill:hover{opacity:.8}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:var(--radius-md);padding:7px 12px;margin-bottom:14px}
.search-bar i{color:var(--text-tertiary);font-size:15px}
.search-bar input{border:none;background:transparent;outline:none;flex:1;font-size:13px;color:var(--text-primary);padding:0;box-shadow:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite;display:inline-block}
/* ── Auth screen ── */
.auth-screen{position:fixed;inset:0;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;overflow-y:auto}
.auth-card{background:var(--bg-primary);border:0.5px solid var(--border);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.10)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.auth-logo-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-logo-icon i{font-size:20px;color:#fff}
.auth-logo-name{font-size:20px;font-weight:700;color:var(--text-primary)}
.auth-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:24px}
.auth-input-wrap{position:relative;margin-bottom:12px}
.auth-input-wrap i.input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-tertiary);pointer-events:none}
.auth-input{width:100%;padding:12px 12px 12px 38px;border:0.5px solid var(--border-md);border-radius:10px;background:var(--bg-primary);color:var(--text-primary);font-size:16px !important;font-family:inherit;transition:border-color .15s;outline:none;box-sizing:border-box;-webkit-appearance:none}
.auth-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
.auth-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;-webkit-tap-highlight-color:transparent}
.auth-btn:hover{background:var(--accent-dark)}
.auth-btn:active{background:var(--accent-dark);transform:scale(.98)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-error{font-size:12px;color:#A32D2D;background:#FCEBEB;padding:8px 12px;border-radius:8px;margin-bottom:12px;display:none}
.auth-success{font-size:12px;color:#27500A;background:#EAF3DE;padding:8px 12px;border-radius:8px;margin-bottom:12px;display:none}
@media(max-width:600px){
  .auth-screen{padding:16px;align-items:flex-start;padding-top:40px}
  .auth-card{padding:24px 20px;border-radius:16px}
  .auth-input{font-size:16px !important}
}

@media(max-width:900px){
  .sidebar{width:64px}
  .logo span,.nav-item span,.nav-section,.storage-info span{display:none}
  .logo{justify-content:center;padding:14px 0}
  .nav-item{justify-content:center;padding:10px}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two-col{grid-template-columns:1fr}
  .topbar{padding:0 12px}
  .btn span{display:none}
  .btn{padding:7px 9px}
  .btn-primary span{display:inline}
}

/* ── Mobile phone ── */
@media(max-width:600px){
  body{overflow:hidden;font-size:14px}

  /* Hide desktop sidebar */
  .sidebar{display:none}

  /* Full width layout */
  .app{flex-direction:column;height:100dvh;height:100vh}
  .main{flex:1;overflow:hidden;display:flex;flex-direction:column;padding-bottom:62px}

  /* Topbar */
  .topbar{padding:0 12px;height:50px;flex-shrink:0;box-shadow:0 1px 0 var(--border)}
  .page-title{font-size:15px;font-weight:600}
  .topbar-right{gap:4px}
  .btn{padding:6px 8px;font-size:12px;border-radius:8px}
  .btn span{display:none !important}
  .btn-primary{padding:8px 14px;font-size:13px}
  .btn-primary #add-lbl{display:inline !important}
  .btn-primary i{font-size:16px}

  /* Scrollable content */
  .content{flex:1;overflow-y:auto;padding:12px 12px 8px;-webkit-overflow-scrolling:touch}

  /* ── Dashboard ── */
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .metric{padding:12px;border-radius:10px}
  .metric-label{font-size:11px;margin-bottom:4px}
  .metric-value{font-size:20px;font-weight:700}
  .metric-sub{font-size:10px}
  .two-col{grid-template-columns:1fr;gap:10px}
  .card{padding:14px}
  .save-notice{font-size:11px;padding:6px 10px;margin-bottom:10px}

  /* Dashboard deal rows — bigger tap target */
  .card div[onclick]{min-height:44px}

  /* ── Contacts — card list instead of table ── */
  .contact-table{display:none !important}
  #contacts-mobile-list{display:flex;flex-direction:column;gap:0}
  .contact-mobile-card{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    background:var(--bg-primary);

<script>
// ─── API config ───────────────────────────────────────────────────────────────
const API_ENDPOINT = 'https://crm-proxy.kareen-e9d.workers.dev';

const PALETTE=['#888780','#185FA5','#854F0B','#3B6D11','#993C1D','#534AB7','#0F6E56','#72243E','#A32D2D','#633806','#1D9E75','#D85A30'];
const BG_MAP={'#888780':'#F1EFE8','#185FA5':'#E6F1FB','#854F0B':'#FAEEDA','#3B6D11':'#EAF3DE','#993C1D':'#FAECE7','#534AB7':'#EEEDFE','#0F6E56':'#E1F5EE','#72243E':'#FBEAF0','#A32D2D':'#FCEBEB','#633806':'#FFF3EE','#1D9E75':'#E1F5EE','#D85A30':'#FAECE7'};
function stageBg(c){return BG_MAP[c]||'#F5F5F4'}

// Salesperson avatar colours (cycle)
const SP_COLORS=[
  ['#B5D4F4','#0C447C'],['#C0DD97','#27500A'],['#F4C0D1','#72243E'],
  ['#FAC775','#633806'],['#9FE1CB','#085041'],['#EEEDFE','#3C3489'],
  ['#F5C4B3','#712B13'],['#9FE1CB','#0F6E56'],['#CECBF6','#3C3489'],
];
function spColors(idx){return SP_COLORS[idx%SP_COLORS.length]}

const DEFAULT_INDUSTRIES=['Glove','FMCG','Pharmaceutical','Medical Devices','Others'];
const IND_COLORS_DEFAULT={'Glove':['#E1F5EE','#0F6E56'],'FMCG':['#E6F1FB','#185FA5'],'Pharmaceutical':['#EEEDFE','#534AB7'],'Medical Devices':['#FAEEDA','#854F0B'],'Others':['#F1EFE8','#5F5E5A']};
const IND_EXTRA_COLORS=[['#FEF3C7','#92400E'],['#FCE7F3','#9D174D'],['#EDE9FE','#4C1D95'],['#ECFDF5','#065F46'],['#FFF7ED','#9A3412'],['#F0F9FF','#0369A1'],['#F9FAFB','#374151']];
// Industries live in S.industries/S.indColors and sync to Supabase via persist()
// localStorage is only an offline cache — cloud is the source of truth
let INDUSTRIES = [...DEFAULT_INDUSTRIES];
let IND_COLORS  = {...IND_COLORS_DEFAULT};

function saveIndustries(){
  S.industries = [...INDUSTRIES];
  S.indColors  = {...IND_COLORS};
  persist();
}

function getIndColor(ind){
  return IND_COLORS[ind]||['#F1EFE8','#5F5E5A'];
}

function addIndustry(name){
  name=name.trim();
  if(!name||INDUSTRIES.includes(name))return false;
  // Assign a colour from the extra palette
  const idx=(INDUSTRIES.length-DEFAULT_INDUSTRIES.length)%IND_EXTRA_COLORS.length;
  IND_COLORS[name]=IND_EXTRA_COLORS[idx];
  INDUSTRIES.push(name);
  saveIndustries();
  return true;
}

function removeIndustry(name){
  if(DEFAULT_INDUSTRIES.includes(name))return false; // can't remove defaults
  INDUSTRIES=INDUSTRIES.filter(i=>i!==name);
  delete IND_COLORS[name];
  saveIndustries();
  return true;
}

function renameIndustry(oldName,newName){
  newName=newName.trim();
  if(!newName||newName===oldName||INDUSTRIES.includes(newName))return false;
  const idx=INDUSTRIES.indexOf(oldName);
  if(idx<0)return false;
  INDUSTRIES[idx]=newName;
  IND_COLORS[newName]=IND_COLORS[oldName]||['#F1EFE8','#5F5E5A'];
  if(newName!==oldName)delete IND_COLORS[oldName];
  // Update all contacts and deals that used oldName
  S.contacts.forEach(c=>{if(c.industry===oldName)c.industry=newName;});
  S.deals.forEach(d=>{if(d.industry===oldName)d.industry=newName;});
  saveIndustries();
  persist();
  return true;
}

function industryOpts(sel){
  return`<option value="">— Select industry —</option>`+
  INDUSTRIES.map(i=>`<option value="${i}"${i===sel?' selected':''}>${i}</option>`).join('')+
  `<option value="__add__" style="color:var(--accent);font-style:italic">+ Add new industry…</option>`;
}

function industryBadge(ind){
  if(!ind)return'';
  const[bg,fg]=getIndColor(ind);
  return`<span style="font-size:10px;padding:2px 8px;border-radius:99px;background:${bg};color:${fg};font-weight:500">${esc(ind)}</span>`;
}

// Handle "Add new industry" selection in any dropdown
function handleIndustrySelect(selectEl, callback){
  if(selectEl.value==='__add__'){
    selectEl.value=''; // reset dropdown
    const name=prompt('Enter new industry name:');
    if(name&&name.trim()){
      if(addIndustry(name.trim())){
        selectEl.value=name.trim();
        // Rebuild options
        selectEl.innerHTML=industryOpts(name.trim());
        selectEl.value=name.trim();
        if(callback)callback(name.trim());
      } else {
        alert(`"${name.trim()}" already exists.`);
      }
    }
  }
}

function openManageIndustries(){
  renderManageIndustriesModal();
}

function renderManageIndustriesModal(){
  const rows=INDUSTRIES.map((ind,i)=>{
    const[bg,fg]=getIndColor(ind);
    const isDefault=DEFAULT_INDUSTRIES.includes(ind);
    return`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--bg-secondary);border-radius:var(--radius-md);border:0.5px solid var(--border);margin-bottom:6px">
      <span style="width:14px;height:14px;border-radius:50%;background:${bg};border:2px solid ${fg};flex-shrink:0"></span>
      <input style="flex:1;background:transparent;border:none;outline:none;font-size:13px;color:var(--text-primary);font-family:inherit;border-bottom:1px solid transparent;transition:border-color .15s;padding:2px 0"
        value="${esc(ind)}"
        ${isDefault?'':''}
        onchange="renameIndustry('${esc(ind)}',this.value);renderManageIndustriesModal()"
        onfocus="this.style.borderBottomColor='var(--accent)'"
        onblur="this.style.borderBottomColor='transparent'"
        placeholder="Industry name">
      ${isDefault
        ?`<span style="font-size:10px;color:var(--text-tertiary);flex-shrink:0">default</span>`
        :`<button onclick="if(confirm('Remove ${esc(ind)}?')){removeIndustry('${esc(ind)}');renderManageIndustriesModal();render();}" style="background:none;border:none;cursor:pointer;color:var(--text-tertiary);padding:3px 5px;border-radius:4px;font-size:13px;display:flex;align-items:center;transition:color .12s" onmouseenter="this.style.color='#A32D2D'" onmouseleave="this.style.color='var(--text-tertiary)')"><i class="ti ti-trash"></i></button>`
      }
    </div>`;
  }).join('');

  showModal(`
  <div class="modal-hdr">
    <div class="modal-title"><i class="ti ti-building-factory-2" style="margin-right:6px;font-size:16px;vertical-align:-2px"></i>Manage industries</div>
    <button class="btn btn-icon" onclick="closeMod()"><i class="ti ti-x"></i></button>
  </div>
  <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;line-height:1.6">Click any name to rename it. Default industries cannot be deleted. Custom ones can be removed.</p>
  <div id="ind-list">${rows}</div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <input id="new-ind-input" placeholder="New industry name…" style="flex:1;padding:8px 11px;border:0.5px solid var(--border-md);border-radius:var(--radius-md);font-size:13px;font-family:inherit" onkeydown="if(event.key==='Enter')addIndFromModal()">
    <button class="btn btn-primary btn-sm" onclick="addIndFromModal()"><i class="ti ti-plus"></i> Add</button>
  </div>
  <div id="ind-msg" style="display:none;font-size:11px;margin-top:8px;padding:6px 10px;border-radius:var(--radius-md)"></div>
  <div class="modal-foot"><button class="btn btn-primary" onclick="closeMod();render()"><i class="ti ti-circle-check"></i> Done</button></div>`);
  setTimeout(()=>document.getElementById('new-ind-input')?.focus(),50);
}

function addIndFromModal(){
  const inp=document.getElementById('new-ind-input');
  const msg=document.getElementById('ind-msg');
  if(!inp)return;
  const name=inp.value.trim();
  if(!name)return;
  if(addIndustry(name)){
    inp.value='';
    if(msg){msg.textContent=`✅ "${name}" added!`;msg.style.cssText='display:block;font-size:11px;margin-top:8px;padding:6px 10px;border-radius:8px;background:#EAF3DE;color:#27500A';}
    renderManageIndustriesModal();
    setTimeout(()=>document.getElementById('new-ind-input')?.focus(),50);
  } else {
    if(msg){msg.textContent=`"${name}" already exists.`;msg.style.cssText='display:block;font-size:11px;margin-top:8px;padding:6px 10px;border-radius:8px;background:#FCEBEB;color:#A32D2D';}
  }
}

// ─── Defaults ─────────────────────────────────────────────────────────────────
const DEF_STAGES=[
  {id:'s1',name:'Lead',color:'#888780'},{id:'s2',name:'Qualified',color:'#185FA5'},
  {id:'s3',name:'Proposal',color:'#854F0B'},{id:'s4',name:'Negotiation',color:'#3B6D11'},
  {id:'s5',name:'Won',color:'#3B6D11'}
];
const DEF_SP=[
  {id:'sp1',name:'Amirul Hakim'},{id:'sp2',name:'Nurul Izzati'},{id:'sp3',name:'Raj Selvam'}
];
const SEED={
  stages:JSON.parse(JSON.stringify(DEF_STAGES)),

async function sbFetch(table,method='GET',body=null,params=''){
  const url=`${SB.url}/rest/v1/${table}${params}`;
  const headers={...sbHeaders()};
  if(method==='POST'||method==='PATCH') headers['Prefer']='resolution=merge-duplicates,return=minimal';
  const opts={method,headers};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(url,opts);
  if(!r.ok){const t=await r.text();throw new Error(`${r.status}: ${t}`);}
  if(method==='DELETE'||r.status===204) return null;
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')?r.json():null;
}

async function persist(){
  _lastSyncTime = Date.now();
  const payload={stages:S.stages,salespeople:S.salespeople,contacts:S.contacts,deals:S.deals,tasks:S.tasks,activity:S.activity,industries:S.industries,indColors:S.indColors};
  // Always cache locally
  try{localStorage.setItem(LS,JSON.stringify(payload));}catch(e){}
  if(!SB) return;
  setSyncStatus('syncing','Saving…');
  try{
    await Promise.all([
      persistTable('stages',     S.stages,     stageToRow),
      persistTable('salespeople',S.salespeople,spToRow),
      persistTable('contacts',   S.contacts,   contactToRow),
      persistTable('deals',      S.deals,      dealToRow),
      persistTable('tasks',      S.tasks,      taskToRow),
      persistActivity(),
      persistSettings()
    ]);
    setSyncStatus('ok','Cloud synced');
  }catch(e){
    setSyncStatus('error','Sync error — retrying…');
    console.warn('Supabase persist error:',e);
    setTimeout(()=>persist(),4000);
  }
}

async function persistTable(table, items, mapper){
  if(!items||!items.length){
    // Delete all rows for this table
    await sbFetch(table,'DELETE',null,'?id=neq.___none___');
    return;
  }
  // Upsert all rows
  const rows=items.map(mapper);
  await sbFetch(table,'POST',rows,'');
  // Delete rows not in current set
  const ids=items.map(i=>i.id).join(',');
  await sbFetch(table,'DELETE',null,`?id=not.in.(${ids})`);
}

async function persistActivity(){
  if(!S.activity||!S.activity.length) return;

async function loadFromSupabase(){
  try{
    const [stages,salespeople,contacts,deals,tasks,activity,settings]=await Promise.all([
      sbFetch('stages','GET',null,'?order=sort_order.asc'),
      sbFetch('salespeople','GET',null,'?order=created_at.asc'),
      sbFetch('contacts','GET',null,'?order=created_at.asc&limit=1000'),
      sbFetch('deals','GET',null,'?order=created_at.asc&limit=1000'),
      sbFetch('tasks','GET',null,'?order=created_at.asc&limit=500'),
      sbFetch('activity','GET',null,'?order=created_at.desc&limit=100'),
      sbFetch('settings','GET',null,'?id=eq.industries').catch(()=>null),
    ]);
    // Parse industries from settings table
    let industries=[...DEFAULT_INDUSTRIES], indColors={...IND_COLORS_DEFAULT};
    if(settings&&settings.length){
      try{
        const parsed=JSON.parse(settings[0].value);
        if(parsed.industries&&parsed.industries.length) industries=parsed.industries;
        if(parsed.indColors) indColors=parsed.indColors;
      }catch(e){}
    }
    return{
      stages:     (stages||[]).map(rowToStage),
      salespeople:(salespeople||[]).map(rowToSp),
      contacts:   (contacts||[]).map(rowToContact),
      deals:      (deals||[]).map(rowToDeal),
      tasks:      (tasks||[]).map(rowToTask),
      activity:   (activity||[]).map(rowToAct),
      industries, indColors,
      updated_at: new Date().toISOString()
    };
  }catch(e){console.warn('Supabase load error:',e);return null;}
}

function applyData(d){
  if(Array.isArray(d.stages))      S.stages      = d.stages.length ? d.stages : JSON.parse(JSON.stringify(SEED.stages));
  if(Array.isArray(d.salespeople)) S.salespeople = d.salespeople;
  if(Array.isArray(d.contacts))    S.contacts    = d.contacts;
  if(Array.isArray(d.deals))       S.deals       = d.deals;
  if(Array.isArray(d.tasks))       S.tasks       = d.tasks;
  if(Array.isArray(d.activity))    S.activity    = d.activity;
  if(!S.stages.length) S.stages=JSON.parse(JSON.stringify(SEED.stages));
  // Apply industries — update global vars so all UI reflects latest
  if(Array.isArray(d.industries)&&d.industries.length){
    S.industries=d.industries; INDUSTRIES=d.industries;
  } else {
    S.industries=[...DEFAULT_INDUSTRIES]; INDUSTRIES=[...DEFAULT_INDUSTRIES];
  }
  if(d.indColors&&Object.keys(d.indColors).length){
    S.indColors=d.indColors; IND_COLORS=d.indColors;
  } else {
    S.indColors={...IND_COLORS_DEFAULT}; IND_COLORS={...IND_COLORS_DEFAULT};
  }
}

async function loadDataAndRender(){
  // Auto-connect Supabase
  if(AUTO_SB_URL && AUTO_SB_KEY && AUTO_SB_KEY !== 'PASTE_YOUR_PUBLISHABLE_KEY_HERE'){
    SB = {url: AUTO_SB_URL, key: AUTO_SB_KEY};
    sbSave(SB);
  } else {
    SB = sbLoad();
  }

  if(SB){
    setSyncStatus('syncing','Syncing…');
    const cloud = await loadFromSupabase();
    if(cloud){
      // Cloud loaded successfully — use cloud data
      applyData(cloud);
      try{localStorage.setItem(LS,JSON.stringify({stages:S.stages,salespeople:S.salespeople,contacts:S.contacts,deals:S.deals,tasks:S.tasks,activity:S.activity,industries:S.industries,indColors:S.indColors}));}catch(e){}
      setSyncStatus('ok','Cloud synced');
    } else {
      // Cloud failed — check if localStorage has real data
      const local = loadLS();
      if(local && (local.contacts?.length || local.deals?.length)){
        // Use cached local data — do NOT overwrite with seed
        applyData(local);
        setSyncStatus('error','Sync error — showing cached data. Retrying…');
        // Retry sync in background after 5 seconds
        setTimeout(()=>backgroundSync(), 5000);
      } else {
        // Truly no data — check if Supabase tables need seeding
        // Only use seed if this is a brand new setup
        setSyncStatus('error','Could not reach database. Check connection.');
      }
    }
  } else {
    setSyncStatus('local','Local only');
    const local = loadLS();
    if(local){applyData(local);}
    else{['stages','salespeople','contacts','deals','tasks','activity'].forEach(k=>S[k]=JSON.parse(JSON.stringify(SEED[k])));persist();}
  }

  render();
  startAutoSync();
}

  </div>

function buildMobileContactCards(q, indFilter){
  const query=(q||'').toLowerCase().trim();
  const list=S.contacts.filter(c=>{
    const matchQ=!query||
      (c.name||'').toLowerCase().includes(query)||
      (c.email||'').toLowerCase().includes(query)||
      (c.company||'').toLowerCase().includes(query)||
      (c.phone||'').toLowerCase().includes(query)||
      (c.industry||'').toLowerCase().includes(query)||
      (c.status||'').toLowerCase().includes(query)||
      (c.address||'').toLowerCase().includes(query);
    const matchI=!indFilter||c.industry===indFilter;
    return matchQ&&matchI;
  });
  if(!list.length) return`<div class="empty" style="padding:32px">No contacts found</div>`;
  return list.map((c,i)=>{
    const[bg,fg]=AVS[i%AVS.length];
    const dealsCount=S.deals.filter(d=>d.contact===c.name).length;
    return`<div class="contact-mobile-card" onclick="openContact('${c.id}')">
      <div class="avatar" style="background:${bg};color:${fg};width:42px;height:42px;font-size:14px;flex-shrink:0">${ini(c.name)}</div>
      <div class="contact-mobile-info">
        <div class="contact-mobile-name">${esc(c.name)}</div>
        <div class="contact-mobile-sub">${esc(c.company||c.email||'')}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap">
          ${industryBadge(c.industry)}
          ${statusBadge(c.status)}
          ${dealsCount>0?`<span style="font-size:10px;color:var(--text-tertiary)">${dealsCount} deal${dealsCount>1?'s':''}</span>`:''}
        </div>
      </div>
      <div class="contact-mobile-right">
        <i class="ti ti-chevron-right contact-mobile-chevron"></i>
        ${c.phone?`<span style="font-size:10px;color:var(--text-tertiary)">${esc(c.phone)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function buildContactRows(q, indFilter){
  const query=(q||'').toLowerCase().trim();

    const matchQ=!query||
      (c.name||'').toLowerCase().includes(query)||
      (c.email||'').toLowerCase().includes(query)||
      (c.company||'').toLowerCase().includes(query)||
      (c.phone||'').toLowerCase().includes(query)||
      (c.industry||'').toLowerCase().includes(query)||
      (c.status||'').toLowerCase().includes(query)||

function filterContactsTable(val){
  S.search=val;
  const indFilter=S.filterIndustry==='all'?null:S.filterIndustry;
  // Update desktop table
  const tbody=document.getElementById('contacts-tbody');
  if(tbody) tbody.innerHTML=buildContactRows(val,indFilter);
  // Update mobile card list
  const mobileList=document.getElementById('contacts-mobile-list');
  if(mobileList) mobileList.innerHTML=buildMobileContactCards(val,indFilter);
  // Update hint
  const hint=document.getElementById('contacts-search-hint');
  if(hint){
    if(val.trim()){
      const count=document.querySelectorAll('#contacts-tbody tr[onclick]').length;
      hint.textContent=`${count} result(s) found`;
      hint.style.display='';
    } else { hint.style.display='none'; }
  }
  const clearBtn=document.getElementById('contacts-search-clear');
  if(clearBtn) clearBtn.style.display=val?'flex':'none';
}

// ─── Drag & Drop ──────────────────────────────────────────────────────────────
function initDragDrop(){}
function onDS(e,id){dragId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>{const el=document.querySelector(`[data-did="${id}"]`);if(el)el.classList.add('dragging')},0)}
function onDE(){dragId=null;document.querySelectorAll('.deal-card').forEach(c=>c.classList.remove('dragging'));document.querySelectorAll('.pipe-col').forEach(c=>c.classList.remove('drag-over'))}
function onDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.closest('.pipe-col')?.classList.add('drag-over')}
function onDragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.closest('.pipe-col')?.classList.remove('drag-over')}
function onDrop(e,sid){
  e.preventDefault();e.currentTarget.closest('.pipe-col')?.classList.remove('drag-over');
  if(!dragId)return;
  const d=S.deals.find(x=>x.id===dragId);
  if(d&&d.stage!==sid){const o=stageById(d.stage),n=stageById(sid);d.stage=sid;addAct('ti-git-merge',`Deal moved: ${d.name} — ${o.name} → ${n.name}`);persist();render()}
}

function addStageQuick(){
  const s={id:uid(),name:'New Stage',color:PALETTE[S.stages.length%PALETTE.length]};
  S.stages.push(s);addAct('ti-circle-plus',`Stage added: ${s.name}`);persist();render();

function inlineRenameStage(sid,nameEl){
  if(!nameEl)return;const s=stageById(sid);const orig=s.name;
  nameEl.contentEditable='true';nameEl.style.borderBottom='1px solid var(--accent)';nameEl.style.outline='none';
  nameEl.focus();const sel=window.getSelection(),r=document.createRange();r.selectNodeContents(nameEl);sel.removeAllRanges();sel.addRange(r);
  function commit(){nameEl.contentEditable='false';nameEl.style.borderBottom='';const nv=nameEl.textContent.trim();if(nv&&nv!==orig){s.name=nv;addAct('ti-pencil',`Stage renamed: "${orig}" → "${nv}"`);persist();render()}else nameEl.textContent=orig}
  nameEl.onblur=commit;
  nameEl.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();nameEl.blur()}if(e.key==='Escape'){nameEl.textContent=orig;nameEl.contentEditable='false';nameEl.style.borderBottom=''}};
}
function quickColorStage(sid){

  dot.parentElement.style.position='relative';dot.parentElement.appendChild(popup);

function applyStageColor(sid,color){const s=stageById(sid);if(s){s.color=color;persist()}const p=document.getElementById('qcp-'+sid);if(p)p.remove();openCpId=null;render()}

function toggleCp(sid){document.querySelectorAll('.color-picker-popup').forEach(p=>{if(p.id!=='cpp-'+sid)p.style.display='none'});const cp=document.getElementById('cpp-'+sid);if(cp)cp.style.display=cp.style.display==='flex'?'none':'flex'}

function renameStage(sid,name){const s=stageById(sid);if(s&&name.trim()){s.name=name.trim();persist();if(S.view==='pipeline')render()}}
function deleteStage(sid){
  if(S.stages.length<=1){alert('Keep at least one stage.');return}
  const s=stageById(sid);const n=S.deals.filter(d=>d.stage===sid).length;
  if(n>0&&!confirm(`"${s.name}" has ${n} deal(s). They will move to the first stage. Continue?`))return;
  if(n>0){const first=S.stages.find(x=>x.id!==sid);S.deals.forEach(d=>{if(d.stage===sid)d.stage=first.id})}
  S.stages=S.stages.filter(x=>x.id!==sid);addAct('ti-trash',`Stage deleted: ${s.name}`);persist();renderManageModal();if(S.view==='pipeline')render();
}
function addStageModal(){

function initModalDrag(){
  const list=document.getElementById('slist');if(!list)return;let dragging=null;
  list.querySelectorAll('.stage-row').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragging=row;e.dataTransfer.effectAllowed='move';setTimeout(()=>row.style.opacity='.4',0)});
    row.addEventListener('dragend',()=>{dragging=null;row.style.opacity='';list.querySelectorAll('.stage-row').forEach(r=>{r.style.borderTop='';r.style.borderBottom=''})});
    row.addEventListener('dragover',e=>{e.preventDefault();if(!dragging||dragging===row)return;list.querySelectorAll('.stage-row').forEach(r=>{r.style.borderTop='';r.style.borderBottom=''});const mid=row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;if(e.clientY<mid)row.style.borderTop='2px solid var(--accent)';else row.style.borderBottom='2px solid var(--accent)'});
    row.addEventListener('dragleave',()=>{row.style.borderTop='';row.style.borderBottom=''});
    row.addEventListener('drop',e=>{e.preventDefault();row.style.borderTop='';row.style.borderBottom='';if(!dragging||dragging===row)return;const allRows=[...list.querySelectorAll('.stage-row')];const fi=allRows.indexOf(dragging),ti=allRows.indexOf(row);const before=e.clientY<row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;const[moved]=S.stages.splice(fi,1);const ni=ti+(before?0:1)-(fi<ti?1:0);S.stages.splice(Math.max(0,ni),0,moved);persist();renderManageModal();if(S.view==='pipeline')render()});
  });
}

// ─── Multi-photo name card scanning ──────────────────────────────────────────
let _cardPhotos = []; // array of {dataUrl, label} for multi-photo
let _cardPhotoData = null; // first photo (saved with contact for backwards compat)

function addCardPhotos(input){
  const files=[...input.files];
  if(!files.length)return;
  let loaded=0;
  files.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const dataUrl=e.target.result;
      _cardPhotos.push({dataUrl, label:`Photo ${_cardPhotos.length+1}`});
      if(_cardPhotoData===null) _cardPhotoData=dataUrl; // save first as primary
      loaded++;
      if(loaded===files.length) renderPhotoThumbs();
    };
    reader.readAsDataURL(file);
  });
  input.value=''; // allow re-selecting same file
}

function addCameraPhoto(dataUrl){
  _cardPhotos.push({dataUrl, label:`Photo ${_cardPhotos.length+1}`});
  if(_cardPhotoData===null) _cardPhotoData=dataUrl;
  renderPhotoThumbs();
}

function removeCardPhoto(idx){
  _cardPhotos.splice(idx,1);
  _cardPhotoData=_cardPhotos.length>0?_cardPhotos[0].dataUrl:null;
  renderPhotoThumbs();
}

function renderPhotoThumbs(){
  const wrap=document.getElementById('nc-thumbs');
  const btnWrap=document.getElementById('nc-scan-btn-wrap');
  if(!wrap)return;

  wrap.innerHTML=_cardPhotos.map((p,i)=>`

    </div>`).join('');

  // Add-more button always at end
  wrap.innerHTML+=`
    <div style="display:flex;flex-direction:column;gap:4px">
      <div onclick="document.getElementById('nc-upload').click()" style="width:80px;height:56px;border:1.5px dashed var(--border-md);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--text-tertiary);font-size:10px;gap:3px;transition:border-color .12s" onmouseenter="this.style.borderColor='var(--accent)'" onmouseleave="this.style.borderColor='var(--border-md)')">
        <i class="ti ti-plus" style="font-size:16px"></i>
        <span>Add</span>

        <i class="ti ti-camera" style="font-size:12px"></i> Camera
      </div>
    </div>`;

  if(btnWrap){
    if(_cardPhotos.length>0){
      btnWrap.style.display='';
      btnWrap.innerHTML=`<button class="btn btn-sm btn-primary" onclick="scanAllPhotos()" style="width:100%;justify-content:center"><i class="ti ti-wand"></i> Read ${_cardPhotos.length} photo(s) &amp; fill form</button>`;

function startCameraStream(){
  const v = document.getElementById('shared-cam-video');
  if(!v) return;
  if(v._stream) v._stream.getTracks().forEach(t=>t.stop());
  v._stream = null;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showCamError('Camera not supported on this browser.');return;
  }
  // Check number of cameras first
  navigator.mediaDevices.enumerateDevices()
    .then(devices=>{
      const cams=devices.filter(d=>d.kind==='videoinput');
      const flipBtn=document.getElementById('cam-flip-btn');
      const hasMultiple=cams.length>=2;
      if(flipBtn) flipBtn.style.display=hasMultiple?'flex':'none';
      // On single-camera device (laptop), just use default — no facingMode constraint
      const constraints=hasMultiple?{video:{facingMode:_camFacing}}:{video:true};
      return navigator.mediaDevices.getUserMedia(constraints);
    })
    .then(stream=>{
      const v=document.getElementById('shared-cam-video');
      if(!v){stream.getTracks().forEach(t=>t.stop());return;}
      v.srcObject=stream;v._stream=stream;
      const flipBtn=document.getElementById('cam-flip-btn');
      const label=document.getElementById('cam-facing-label');
      if(label){
        if(flipBtn&&flipBtn.style.display==='flex'){
          label.textContent=_camFacing==='environment'?'📷 Back camera':'🤳 Front camera';
        } else {
          label.textContent='📷 Camera';
        }
      }
      const err=document.getElementById('cam-error');
      if(err)err.style.display='none';
    })
    .catch(err=>{
      const msg=err.name==='NotAllowedError'
        ?'Camera permission denied. Please allow camera access in your browser settings.'
        :err.name==='NotFoundError'?'No camera found on this device.'
        :'Could not start camera: '+err.message;
      showCamError(msg);
    });
}

function showCamError(msg){

function captureSharedPhoto(){
  const v = document.getElementById('shared-cam-video');
  const c = document.getElementById('shared-cam-canvas');
  if(!v || !c || !v._stream) return;
  c.width  = v.videoWidth  || 640;
  c.height = v.videoHeight || 480;
  const ctx = c.getContext('2d');
  if(_camFacing==='user'){
    ctx.translate(c.width,0); ctx.scale(-1,1);
  }
  ctx.drawImage(v,0,0);
  const dataUrl = c.toDataURL('image/jpeg',0.88);
  // Stop stream before closing
  v._stream.getTracks().forEach(t=>t.stop());
  v._stream = null;
  closeMod();
  // Deliver photo to correct context
  setTimeout(()=>{
    if(_camContext==='contact'){
      openAddContact();
      setTimeout(()=>{ addCameraPhoto(dataUrl); renderPhotoThumbs(); }, 80);

      _dealCardPhotos.push(dataUrl);

  }, 50);
}

// ─── Scan ALL photos together ─────────────────────────────────────────────────
async function scanAllPhotos(){
  if(!_cardPhotos.length)return;
  const scanEl=document.getElementById('nc-scanning');
  const msgEl=document.getElementById('nc-scan-msg');
  if(scanEl){scanEl.style.cssText='display:flex;margin-top:8px;font-size:12px;color:var(--accent);align-items:center;gap:6px';}
  if(msgEl)msgEl.textContent=`Reading ${_cardPhotos.length} photo(s)…`;
  const extraEl=document.getElementById('nc-scan-extra');
  if(extraEl)extraEl.style.display='none';

  try{
    // Compress all photos
    const compressed = await Promise.all(_cardPhotos.map(p=>compressImage(p.dataUrl,800)));

    // Build message content with all images
    const content=[];
    compressed.forEach((dataUrl,i)=>{
      const base64=dataUrl.split(',')[1];
      const mime=dataUrl.split(';')[0].split(':')[1]||'image/jpeg';
      content.push({type:'image',source:{type:'base64',media_type:mime,data:base64}});
      content.push({type:'text',text:`Image ${i+1} of ${compressed.length} (${i===0?'front':'back/other side'})`});
    });
    content.push({type:'text',text:`These are ${compressed.length} photos of the same business card (front and back). Extract ALL contact information combining data from all images. Return ONLY a raw JSON object with keys: name, email, phone, company, address, title, website. Merge information from all photos — if front has the name and back has the address, include both. Use empty string "" for missing fields.`});

    const res=await fetch(API_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-5',
        max_tokens:600,
        system:`You are an expert business card OCR reader. When given multiple images of the same card (front and back), you combine all information found across all images into one complete contact record. Return ONLY raw JSON, no markdown, no backticks, no explanation.`,
        messages:[{role:'user',content}]
      })
    });

    if(!res.ok) throw new Error(`API error ${res.status}`);
    const data=await res.json();
    if(data.error) throw new Error(data.error.message||'API error');

    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    let parsed;
    try{ parsed=JSON.parse(text.replace(/```json|```/g,'').trim()); }
    catch{ const m=text.match(/\{[\s\S]*\}/); if(m)parsed=JSON.parse(m[0]); else throw new Error('Could not parse response'); }

    // Fill fields — overwrite if value found
    const fill=(id,val)=>{if(val&&String(val).trim()){const el=document.getElementById(id);if(el)el.value=String(val).trim();}};
    fill('m-name',   parsed.name);
    fill('m-email',  parsed.email);
    fill('m-phone',  parsed.phone);
    fill('m-company',parsed.company);
    fill('m-address',parsed.address);

    const extras=[parsed.title,parsed.website].filter(Boolean).join(' · ');
    if(extraEl&&extras){extraEl.textContent='ℹ️ '+extras;extraEl.style.cssText='display:block;font-size:11px;color:var(--text-secondary);margin-top:4px';}

    if(scanEl){scanEl.innerHTML='<i class="ti ti-circle-check" style="font-size:14px;color:#3B6D11"></i><span style="color:#3B6D11">All photos read — fields filled!</span>';setTimeout(()=>{if(scanEl)scanEl.style.display='none';},2500);}

  }catch(e){
    console.error('Multi-scan error:',e);
    if(scanEl){scanEl.innerHTML=`<i class="ti ti-alert-circle" style="font-size:14px;color:#A32D2D"></i><span style="color:#A32D2D">Scan failed: ${e.message}</span>`;}
  }
}

async function doScanNameCard(dataUrl){

  if(scanEl){scanEl.style.cssText='display:flex;margin-top:8px;font-size:12px;color:var(--accent);align-items:center;justify-content:center;gap:6px';}

  try{
    // Compress image to reduce payload size (max 800px wide)
    const compressed = await compressImage(dataUrl, 800);
    const base64=compressed.split(',')[1];
    const mime=compressed.split(';')[0].split(':')[1]||'image/jpeg';

    const res=await fetch(API_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-5',
        max_tokens:500,
        system:`You are a business card OCR reader. Look carefully at the image and extract ALL text. Return ONLY a raw JSON object (no markdown, no backticks, no explanation) with these keys: name, email, phone, company, address, title, website. Use empty string "" for missing fields.`,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:base64}},
          {type:'text',text:'Read this business card carefully and extract: person name, email, phone number, company name, address, job title, website. Return as JSON only.'}
        ]}]
      })
    });

    if(!res.ok){
      const errText=await res.text();
      throw new Error(`API error ${res.status}: ${errText.slice(0,100)}`);
    }

    const data=await res.json();

    // Check for API-level error
    if(data.error) throw new Error(data.error.message||'API error');

    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
    if(!text) throw new Error('No response from AI');

    // Parse JSON — try multiple strategies
    let parsed;
    try{
      // Direct parse
      parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    }catch{
      // Extract JSON from text
      const match=text.match(/\{[\s\S]*\}/);
      if(match) parsed=JSON.parse(match[0]);
      else throw new Error('Could not parse response');
    }

    // Fill in fields — always overwrite if value found
    const fill=(id,val)=>{if(val&&val.trim()){const el=document.getElementById(id);if(el)el.value=val.trim();}};
    fill('m-name',   parsed.name);
    fill('m-email',  parsed.email);
    fill('m-phone',  parsed.phone);
    fill('m-company',parsed.company);
    fill('m-address',parsed.address);

    // Show extra info (title/website) as a hint
    const extra=document.getElementById('nc-scan-extra');
    const extras=[parsed.title,parsed.website].filter(Boolean).join(' · ');
    if(extra&&extras){extra.textContent='ℹ️ '+extras;extra.style.cssText='display:block;font-size:11px;color:var(--text-secondary);margin-top:4px;';}

    // Success feedback
    if(scanEl){scanEl.innerHTML='<i class="ti ti-circle-check" style="font-size:14px;color:#3B6D11"></i> Card read successfully!';scanEl.style.color='#3B6D11';setTimeout(()=>{if(scanEl)scanEl.style.display='none';},2000);}

  }catch(e){
    console.error('Name card scan error:',e);
    if(scanEl){
      scanEl.innerHTML=`<i class="ti ti-alert-circle" style="font-size:14px;color:#A32D2D"></i> <span style="color:#A32D2D">Scan failed — please fill manually. (${e.message})</span>`;
      scanEl.style.color='#A32D2D';
    }
  }
}

// Compress image using canvas
function compressImage(dataUrl, maxWidth){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1, maxWidth/img.width);
      const w=Math.round(img.width*scale);
      const h=Math.round(img.height*scale);
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>resolve(dataUrl); // fallback: use original
    img.src=dataUrl;
  });
}

function attachDealCards(input){

async function scanNameCardForDeal(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const dataUrl=e.target.result;
    _cardPhotoData=dataUrl;
    const prev=document.getElementById('nc2-preview');
    const img=document.getElementById('nc2-img');
    if(prev&&img){img.src=dataUrl;prev.style.display='';}
    const scanEl=document.getElementById('nc2-scanning');
    if(scanEl)scanEl.style.display='flex';
    try{
      const base64=dataUrl.split(',')[1];
      const mime=dataUrl.split(';')[0].split(':')[1]||'image/jpeg';
      const res=await fetch(API_ENDPOINT,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:400,
          system:`Extract contact info from business card. Return ONLY JSON with keys: name,email,phone,company,address,title,website. Empty string for missing fields. No markdown.`,
          messages:[{role:'user',content:[
            {type:'image',source:{type:'base64',media_type:mime,data:base64}},
            {type:'text',text:'Extract contact details as JSON.'}
          ]}]})
      });
      const data=await res.json();
      const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
      const p=JSON.parse(text);
      const set=(id,val)=>{const el=document.getElementById(id);if(el&&!el.value.trim())el.value=val;};
      if(p.name)    set('nc2-name',p.name);
      if(p.email)   set('nc2-email',p.email);
      if(p.phone)   set('nc2-phone',p.phone);
      if(p.company) set('nc2-company',p.company);
      if(p.address) set('nc2-address',p.address);
    }catch(e){console.warn('Scan error',e);}
    finally{if(scanEl)scanEl.style.display='none';}
  };
  reader.readAsDataURL(file);
}

function dataURLtoFile(dataUrl,filename){
  const arr=dataUrl.split(','),mime=arr[0].match(/:(.*?);/)[1],bstr=atob(arr[1]);
  let n=bstr.length;const u8=new Uint8Array(n);while(n--)u8[n]=bstr.charCodeAt(n);
  return new File([u8],filename,{type:mime});
}

    if(btn){btn.innerHTML='<i class="ti ti-check"></i> Copied!';setTimeout(()=>{btn.innerHTML='<i class="ti ti-copy"></i> Copy SQL'},2000);}
  }).catch(()=>alert('Copy failed — please select and copy the SQL manually.'));
}

async function connectSupabase(){
  const url=(document.getElementById('sb-url')?.value||'').trim().replace(/\/$/,'');
  const key=(document.getElementById('sb-key')?.value||'').trim();
  const errEl=document.getElementById('sb-error');
  const btn=document.getElementById('sb-connect-btn');

  if(!url||!key){errEl.textContent='Please enter both the URL and key.';errEl.style.display='';return;}
  if(!url.startsWith('https://')){errEl.textContent='URL must start with https://';errEl.style.display='';return;}

  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2 spin"></i> Testing…';
  errEl.style.display='none';

  // Test the connection
  try{
    const testUrl=`${url}/rest/v1/contacts?limit=1`;
    const r=await fetch(testUrl,{headers:{'apikey':key,'Authorization':'Bearer '+key}});
    if(r.status===401||r.status===403){throw new Error('Invalid API key or RLS is blocking access. Make sure you ran the SQL from Step 2.');}
    if(!r.ok&&r.status!==200&&r.status!==406){throw new Error(`Connection failed (${r.status}). Check your URL and key.`);}
  }catch(e){
    btn.disabled=false;btn.innerHTML='<i class="ti ti-cloud-upload"></i> Connect & sync';
    errEl.textContent=e.message||'Could not connect. Check your URL and key.';errEl.style.display='';return;
  }

  // Save config and push local data to Supabase
  SB={url,key};
  sbSave(SB);
  closeMod();
  setSyncStatus('syncing','Uploading…');

  // Check if Supabase already has data
  try{
    const cloud=await loadFromSupabase();
    if(cloud&&(cloud.contacts?.length||cloud.deals?.length)){
      // Ask user which to use
      showModal(`
      <div class="modal-hdr"><div class="modal-title">Existing data found</div><button class="btn btn-icon" onclick="closeMod()"><i class="ti ti-x"></i></button></div>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.6">
        Your Supabase database already has <strong>${cloud.contacts?.length||0} contacts</strong> and <strong>${cloud.deals?.length||0} deals</strong>. 
        Which data would you like to keep?
      </p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" style="justify-content:flex-start;padding:12px 16px" onclick="useCloudData()">
          <i class="ti ti-cloud-download" style="font-size:17px;color:var(--accent)"></i>
          <div style="text-align:left"><div style="font-weight:500">Use cloud data</div><div style="font-size:11px;color:var(--text-secondary)">Load from Supabase — ${cloud.contacts?.length||0} contacts, ${cloud.deals?.length||0} deals</div></div>
        </button>
        <button class="btn" style="justify-content:flex-start;padding:12px 16px" onclick="useLocalData()">
          <i class="ti ti-device-floppy" style="font-size:17px;color:#3B6D11"></i>
          <div style="text-align:left"><div style="font-weight:500">Use my local data</div><div style="font-size:11px;color:var(--text-secondary)">Keep current data — ${S.contacts.length} contacts, ${S.deals.length} deals — and overwrite cloud</div></div>
        </button>
      </div>`);
      window._cloudDataBuffer=cloud;
    } else {
      // Push local to Supabase
      await persist();
      setSyncStatus('ok','Cloud synced');
      render();
    }
  }catch(e){setSyncStatus('error','Sync error');console.warn(e);}
}

// ─── Auto-sync: pull latest data from Supabase every 30 seconds ───────────────
let _lastSyncTime = 0;
let _syncInterval = null;

async function backgroundSync(){
  if(!SB) return;
  // Don't overwrite if user made a change in the last 8 seconds
  if(Date.now() - _lastSyncTime < 8000) return;
  try{
    const cloud = await loadFromSupabase();
    if(!cloud) return;
    // Compare timestamps — only apply if cloud is newer than our last local save
    const cloudTime = cloud.updated_at ? new Date(cloud.updated_at).getTime() : 0;
    const localSaveTime = _lastSyncTime;
    if(cloudTime > localSaveTime){
      applyData(cloud);
      try{localStorage.setItem(LS,JSON.stringify({stages:S.stages,salespeople:S.salespeople,contacts:S.contacts,deals:S.deals,tasks:S.tasks,activity:S.activity,industries:S.industries,indColors:S.indColors}));}catch(e){}
      setSyncStatus('ok','Cloud synced');
      render();
    }
  }catch(e){ /* silent fail */ }
}

function startAutoSync(){
  if(_syncInterval) clearInterval(_syncInterval);
  if(!SB) return;
  // Poll every 30 seconds
  _syncInterval = setInterval(backgroundSync, 30000);
}

function stopAutoSync(){
  if(_syncInterval){ clearInterval(_syncInterval); _syncInterval=null; }
}

function handleImportDrop(e){
  const file = e.dataTransfer.files[0];
  if(file) processImportFile(file);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(file){ processImportFile(file); e.target.value=''; }
}

function processImportFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  if(ext==='csv'){
    reader.onload = e => parseImportCSV(e.target.result);
    reader.readAsText(file);
  } else if(ext==='xlsx'||ext==='xls'){
    reader.onload = e => parseImportXLSX(e.target.result);
    reader.readAsArrayBuffer(file);
  } else {
    alert('Please upload a .csv, .xlsx, or .xls file.');
  }
}

function parseImportCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2){alert('File appears empty or has no data rows.');return;}
  const headers = parseCSVLine(lines[0]);
  const rows = lines.slice(1).map(l=>parseCSVLine(l));
  showMapper(headers, rows);
}

function parseCSVLine(line){
  const result=[]; let cur='', inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur.trim());cur='';}
    else cur+=c;
  }
  result.push(cur.trim());
  return result;
}

function parseImportXLSX(buf){
  try{
    const wb = XLSX.read(buf, {type:'arraybuffer'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    if(data.length<2){alert('Sheet appears empty or has no data rows.');return;}
    const headers = data[0].map(String);
    const rows = data.slice(1).map(r=>r.map(String));
    showMapper(headers, rows);
  } catch(e){alert('Could not read file. Make sure it is a valid Excel file.');}
}

// ─── Column mapper ─────────────────────────────────────────────────────────────
function showMapper(headers, rows){
  const type = S.view==='contacts' ? 'contacts' : 'deals';
  importCtx = {type, headers, rows};

  const contactFields = [
    {key:'name',      label:'Full name',  required:true},
    {key:'email',     label:'Email',      required:false},
    {key:'phone',     label:'Phone',      required:false},
    {key:'company',   label:'Company',    required:false},
    {key:'address',   label:'Address',    required:false},
    {key:'industry',  label:'Industry',   required:false},
    {key:'status',    label:'Status',     required:false},
  ];
  const dealFields = [
    {key:'name',      label:'Deal name',  required:true},
    {key:'company',   label:'Company',    required:false},
    {key:'contact',   label:'Contact',    required:false},
    {key:'value',     label:'Value (RM)', required:false},
    {key:'stage',     label:'Stage',      required:false},
    {key:'close',     label:'Close date', required:false},
    {key:'industry',  label:'Industry',   required:false},
    {key:'salesperson',label:'Salesperson',required:false},
    {key:'notes',     label:'Notes',      required:false},
  ];
  const fields = type==='contacts' ? contactFields : dealFields;

  // Auto-detect best column match
  function bestMatch(fieldKey, fieldLabel){
    const candidates = [fieldKey, fieldLabel, ...fieldLabel.split(' ')].map(s=>s.toLowerCase());
    const idx = headers.findIndex(h=>candidates.some(c=>h.toLowerCase().includes(c)||c.includes(h.toLowerCase())));
    return idx>=0 ? idx : -1;
  }

  const previewRows = rows.slice(0,3);
  const headerOpts = `<option value="-1">— Skip —</option>` + headers.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join('');

  const fieldRows = fields.map(f=>{
    const auto = bestMatch(f.key, f.label);
    return`<tr>
      <td style="padding:7px 10px;font-size:12px;font-weight:500;white-space:nowrap">${f.label}${f.required?'<span style="color:#A32D2D;margin-left:2px">*</span>':''}</td>
      <td style="padding:7px 10px">
        <select id="map-${f.key}" style="font-size:12px;padding:5px 8px">
          ${headerOpts.replace(`value="${auto}"`,`value="${auto}" selected`)}
        </select>
      </td>
      <td style="padding:7px 10px;font-size:11px;color:var(--text-tertiary);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
        ${auto>=0 ? esc(String(previewRows[0]?.[auto]||'')) : '<span style="color:var(--text-tertiary)">—</span>'}
      </td>
    </tr>`;
  }).join('');

  const previewHtml = previewRows.map(r=>`<tr>${headers.map((_,i)=>`<td style="padding:4px 8px;font-size:11px;border-bottom:0.5px solid var(--border);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(String(r[i]||''))}</td>`).join('')}</tr>`).join('');

  showModal(`
  <div class="modal-hdr">
    <div><div class="modal-title">Map columns — ${type}</div><div style="font-size:11px;color:var(--text-secondary);margin-top:2px">${rows.length} rows detected · ${headers.length} columns</div></div>
    <button class="btn btn-icon" onclick="closeMod()"><i class="ti ti-x"></i></button>
  </div>

  <div style="margin-bottom:14px">
    <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px">Match your columns to CRM fields</div>
    <table style="width:100%;border-collapse:collapse;border:0.5px solid var(--border);border-radius:var(--radius-md);overflow:hidden">
      <thead><tr style="background:var(--bg-secondary)">
        <th style="padding:7px 10px;font-size:11px;color:var(--text-tertiary);font-weight:500;text-align:left">CRM field</th>
        <th style="padding:7px 10px;font-size:11px;color:var(--text-tertiary);font-weight:500;text-align:left">Your column</th>
        <th style="padding:7px 10px;font-size:11px;color:var(--text-tertiary);font-weight:500;text-align:left">Preview</th>
      </tr></thead>
      <tbody>${fieldRows}</tbody>
    </table>
  </div>

  <details style="margin-bottom:14px">
    <summary style="font-size:12px;color:var(--text-secondary);cursor:pointer;user-select:none">▸ Preview first ${previewRows.length} rows of your file</summary>
    <div style="overflow-x:auto;margin-top:8px;border:0.5px solid var(--border);border-radius:var(--radius-md)">
      <table style="border-collapse:collapse;min-width:100%">
        <thead><tr style="background:var(--bg-secondary)">${headers.map(h=>`<th style="padding:5px 8px;font-size:11px;color:var(--text-tertiary);font-weight:500;text-align:left;white-space:nowrap">${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${previewHtml}</tbody>

}

// ─── Run import ───────────────────────────────────────────────────────────────
function runImport(){
  if(!importCtx) return;
  const {type, headers, rows} = importCtx;

  function getVal(row, fieldKey){
    const sel = document.getElementById('map-'+fieldKey);
    if(!sel) return '';
    const idx = parseInt(sel.value);
    if(idx<0||idx>=headers.length) return '';
    return String(row[idx]||'').trim();
  }

  const skipDup  = document.getElementById('import-skip-dup')?.checked;
  const updateDup = document.getElementById('import-update-dup')?.checked;

  let added=0, skipped=0, updated=0, errors=[];

  if(type==='contacts'){
    rows.forEach((row,ri)=>{
      const name = getVal(row,'name');
      if(!name){errors.push(`Row ${ri+2}: no name, skipped`);return;}

      const industry = getVal(row,'industry');
      const status   = getVal(row,'status') || 'lead';
      const validInd = industry ? (INDUSTRIES.includes(industry) ? industry : (addIndustry(industry), industry)) : '';
      const validSt  = ['lead','prospect','customer','churned'].includes(status.toLowerCase()) ? status.toLowerCase() : 'lead';

      const existing = S.contacts.find(c=>c.name.toLowerCase()===name.toLowerCase());
      if(existing){
        if(updateDup){
          existing.email    = getVal(row,'email')   || existing.email;
          existing.phone    = getVal(row,'phone')   || existing.phone;
          existing.company  = getVal(row,'company') || existing.company;
          existing.address  = getVal(row,'address') || existing.address;
          existing.industry = validInd              || existing.industry;
          existing.status   = validSt               || existing.status;
          updated++;
        } else if(skipDup){ skipped++; }
        else {
          S.contacts.push({id:uid(),name,email:getVal(row,'email'),phone:getVal(row,'phone'),company:getVal(row,'company'),address:getVal(row,'address'),industry:validInd,status:validSt});
          added++;
        }
      } else {
        S.contacts.push({id:uid(),name,email:getVal(row,'email'),phone:getVal(row,'phone'),company:getVal(row,'company'),address:getVal(row,'address'),industry:validInd,status:validSt});
        added++;
      }
    });

  } else { // deals
    rows.forEach((row,ri)=>{
      const name = getVal(row,'name');
      if(!name){errors.push(`Row ${ri+2}: no deal name, skipped`);return;}

      const stageRaw = getVal(row,'stage');
      const stageObj = S.stages.find(s=>s.name.toLowerCase()===stageRaw.toLowerCase());
      const stageId  = stageObj ? stageObj.id : S.stages[0]?.id;

      const spRaw  = getVal(row,'salesperson');
      const spObj  = S.salespeople.find(s=>s.name.toLowerCase()===spRaw.toLowerCase());
      const spId   = spObj ? spObj.id : '';

      const valRaw = getVal(row,'value').replace(/[^0-9.]/g,'');
      const value  = parseFloat(valRaw)||0;

      const industry = getVal(row,'industry');
      const validInd = industry ? (INDUSTRIES.includes(industry) ? industry : (addIndustry(industry), industry)) : '';

      const contactName = getVal(row,'contact');
      const companyVal  = getVal(row,'company') || (S.contacts.find(c=>c.name===contactName)?.company||'');

      const existing = S.deals.find(d=>d.name.toLowerCase()===name.toLowerCase());
      if(existing){
        if(updateDup){
          if(stageId)   existing.stage   = stageId;
          if(value)     existing.value   = value;
          if(spId)      existing.spId    = spId;
          if(validInd)  existing.industry= validInd;
          if(companyVal)existing.company = companyVal;
          existing.close = getVal(row,'close') || existing.close;
          existing.notes = getVal(row,'notes') || existing.notes;
          updated++;
        } else if(skipDup){ skipped++; }
        else {
          S.deals.push({id:uid(),name,contact:contactName,company:companyVal,value,stage:stageId,close:getVal(row,'close'),spId,industry:validInd,notes:getVal(row,'notes')});
          added++;
        }
      } else {
        S.deals.push({id:uid(),name,contact:contactName,company:companyVal,value,stage:stageId,close:getVal(row,'close'),spId,industry:validInd,notes:getVal(row,'notes')});
        added++;
      }
    });
  }

  persist();
  addAct('ti-database-import', `Import complete: ${added} added, ${updated} updated, ${skipped} skipped`);
  importCtx = null;

  // Result modal
  const errSection = errors.length ? `<div style="margin-top:10px;max-height:100px;overflow-y:auto;background:var(--bg-secondary);border-radius:var(--radius-md);padding:8px 10px;font-size:11px;color:var(--text-tertiary)">${errors.map(e=>`<div>${esc(e)}</div>`).join('')}</div>` : '';
  showModal(`
  <div class="modal-hdr"><div class="modal-title"><i class="ti ti-circle-check" style="color:#3B6D11;margin-right:6px;font-size:16px;vertical-align:-2px"></i>Import complete</div><button class="btn btn-icon" onclick="closeMod();render()"><i class="ti ti-x"></i></button></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px">
    <div style="background:#EAF3DE;border-radius:var(--radius-md);padding:12px;text-align:center"><div style="font-size:22px;font-weight:600;color:#27500A">${added}</div><div style="font-size:11px;color:#3B6D11;margin-top:2px">Added</div></div>
    <div style="background:#E6F1FB;border-radius:var(--radius-md);padding:12px;text-align:center"><div style="font-size:22px;font-weight:600;color:#0C447C">${updated}</div><div style="font-size:11px;color:#185FA5;margin-top:2px">Updated</div></div>
    <div style="background:var(--bg-secondary);border-radius:var(--radius-md);padding:12px;text-align:center"><div style="font-size:22px;font-weight:600">${skipped}</div><div style="font-size:11px;color:var(--text-tertiary);margin-top:2px">Skipped</div></div>
  </div>
  ${errors.length?`<div style="font-size:12px;color:#A32D2D;margin-bottom:4px">${errors.length} row(s) had issues:</div>${errSection}`:''}
  <div class="modal-foot"><button class="btn btn-primary" onclick="closeMod();render()"><i class="ti ti-circle-check"></i> Done</button></div>`);
}
