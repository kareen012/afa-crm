function exportCurrent(){
  const type=S.view==='contacts'?'contacts':'pipeline';
  const indCheckboxes=`<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="exp-ind-all" checked onchange="toggleAllIndExport(this)" style="width:15px;height:15px;accent-color:var(--accent);padding:0">
      <span style="font-weight:500">All industries</span>
    </label>
    <div style="width:100%;height:0.5px;background:var(--border);margin:2px 0"></div>
    ${INDUSTRIES.map(ind=>{const[bg,fg]=getIndColor(ind)||['#F1EFE8','#5F5E5A'];return`<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" class="exp-ind-cb" value="${ind}" checked onchange="updateAllIndCheckbox()" style="width:15px;height:15px;accent-color:var(--accent);padding:0"><span class="badge" style="background:${bg};color:${fg}">${ind}</span></label>`}).join('')}
  </div>`;
  showModal(`<div class="modal-hdr"><div class="modal-title"><i class="ti ti-file-spreadsheet" style="margin-right:6px;font-size:16px;vertical-align:-2px;color:#3B6D11"></i>Export ${type} to Excel</div><button class="btn btn-icon" onclick="closeMod()"><i class="ti ti-x"></i></button></div>
  <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">Select which industries to include in the export. Unselected industries will be excluded from all sheets.</p>
  <div class="fg"><label class="fl">Industries to export</label>${indCheckboxes}</div>
  <div class="modal-foot">
    <button class="btn" onclick="closeMod()">Cancel</button>
    <button class="btn btn-primary" onclick="runExport('${type}')"><i class="ti ti-download"></i> Download .xlsx</button>
  </div>`);
}

function toggleAllIndExport(cb){
  document.querySelectorAll('.exp-ind-cb').forEach(c=>c.checked=cb.checked);
}
function updateAllIndCheckbox(){
  const all=document.querySelectorAll('.exp-ind-cb');
  const allCb=document.getElementById('exp-ind-all');
  if(allCb) allCb.checked=[...all].every(c=>c.checked);
}
function getSelectedIndustries(){
  const checked=[...document.querySelectorAll('.exp-ind-cb')].filter(c=>c.checked).map(c=>c.value);
  return checked.length===0?INDUSTRIES:checked; // if none checked export all
}

function runExport(type){
  const selInds=getSelectedIndustries();
  closeMod();
  if(type==='contacts') exportContacts(selInds);
  else exportPipeline(selInds);
}

function dlXlsx(wb, filename){
  const wbout=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const blob=new Blob([wbout],{type:'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  addAct('ti-file-spreadsheet',`Exported ${filename}`);
}

function exportContacts(selInds){
  const inds=selInds||INDUSTRIES;
  const filteredContacts=S.contacts.filter(c=>inds.includes(c.industry)||(!c.industry&&inds.length===INDUSTRIES.length));

  const contactRows=filteredContacts.map(c=>({
    'Name':c.name||'',
    'Email':c.email||'',
    'Phone':c.phone||'',
    'Company':c.company||'',
    'Address':c.address||'',
    'Industry':c.industry||'',
    'Status':(c.status||'').charAt(0).toUpperCase()+(c.status||'').slice(1),
    'No. of Deals':S.deals.filter(d=>d.contact===c.name).length,
    'Pipeline Value (RM)':S.deals.filter(d=>d.contact===c.name).reduce((s,d)=>s+Number(d.value||0),0),
  }));

  const detailRows=[];
  filteredContacts.forEach(c=>{
    const cDeals=S.deals.filter(d=>d.contact===c.name);
    if(cDeals.length===0){
      detailRows.push({'Contact':c.name,'Email':c.email||'','Company':c.company||'','Address':c.address||'','Industry':c.industry||'','Status':c.status||'','Deal Name':'—','Stage':'—','Value (RM)':'','Salesperson':'','Close Date':'','Notes':''});
    } else {
      cDeals.forEach(d=>{
        const st=stageById(d.stage);const sp=spById(d.spId);
        detailRows.push({'Contact':c.name,'Email':c.email||'','Company':c.company||'','Address':c.address||'','Industry':c.industry||d.industry||'','Status':c.status||'','Deal Name':d.name||'','Stage':st.name||'','Value (RM)':Number(d.value||0),'Salesperson':sp?sp.name:'Unassigned','Close Date':d.close||'','Notes':d.notes||''});
      });
    }
  });

  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(contactRows);
  const ws2=XLSX.utils.json_to_sheet(detailRows.length?detailRows:[{'Info':'No data for selected industries'}]);
  ws1['!cols']=[{wch:22},{wch:30},{wch:18},{wch:24},{wch:16},{wch:12},{wch:12},{wch:20}];
  ws2['!cols']=[{wch:22},{wch:30},{wch:24},{wch:16},{wch:12},{wch:28},{wch:16},{wch:14},{wch:20},{wch:14},{wch:40}];
  styleHeader(ws1,contactRows[0]?Object.keys(contactRows[0]):[]);
  styleHeader(ws2,detailRows[0]?Object.keys(detailRows[0]):[]);
  XLSX.utils.book_append_sheet(wb,ws1,'Contacts');
  XLSX.utils.book_append_sheet(wb,ws2,'Contact — Deal Details');
  // Summary by industry sheet
  const indSummary=inds.map(ind=>{
    const iContacts=filteredContacts.filter(c=>c.industry===ind);
    const iDeals=S.deals.filter(d=>d.industry===ind);
    return{'Industry':ind,'Contacts':iContacts.length,'Deals':iDeals.length,'Pipeline Value (RM)':iDeals.reduce((s,d)=>s+Number(d.value||0),0)};
  });
  if(indSummary.length){
    const ws3=XLSX.utils.json_to_sheet(indSummary);
    ws3['!cols']=[{wch:18},{wch:12},{wch:12},{wch:20}];
    styleHeader(ws3,Object.keys(indSummary[0]));
    XLSX.utils.book_append_sheet(wb,ws3,'By Industry');
  }
  const label=inds.length===INDUSTRIES.length?'all':inds.join('-').toLowerCase().replace(/\s+/g,'_');
  dlXlsx(wb,`contacts_${label}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportPipeline(selInds){
  const inds=selInds||INDUSTRIES;
  const filteredDeals=S.deals.filter(d=>inds.includes(d.industry)||(!d.industry&&inds.length===INDUSTRIES.length));

  const dealRows=filteredDeals.map(d=>{
    const st=stageById(d.stage);const sp=spById(d.spId);
    return{'Deal Name':d.name||'','Company':d.company||'','Contact':d.contact||'','Industry':d.industry||'','Stage':st.name||'','Value (RM)':Number(d.value||0),'Salesperson':sp?sp.name:'Unassigned','Close Date':d.close||'','Notes':d.notes||''};
  });

  const stageRows=S.stages.map(s=>{
    const stDeals=filteredDeals.filter(d=>d.stage===s.id);
    return{'Stage':s.name,'Number of Deals':stDeals.length,'Total Value (RM)':stDeals.reduce((acc,d)=>acc+Number(d.value||0),0)};
  });
  stageRows.push({'Stage':'TOTAL','Number of Deals':filteredDeals.length,'Total Value (RM)':filteredDeals.reduce((s,d)=>s+Number(d.value||0),0)});

  const wonIds=S.stages.filter(s=>s.name==='Won').map(s=>s.id);
  const spRows=S.salespeople.map(sp=>{
    const spDeals=filteredDeals.filter(d=>d.spId===sp.id);
    const wonDeals=spDeals.filter(d=>wonIds.includes(d.stage));
    return{'Salesperson':sp.name,'Total Deals':spDeals.length,'Pipeline Value (RM)':spDeals.reduce((acc,d)=>acc+Number(d.value||0),0),'Won Deals':wonDeals.length,'Won Value (RM)':wonDeals.reduce((acc,d)=>acc+Number(d.value||0),0),'Open Deals':spDeals.filter(d=>!wonIds.includes(d.stage)).length};
  });
  const unassigned=filteredDeals.filter(d=>!d.spId||!spById(d.spId));
  if(unassigned.length){spRows.push({'Salesperson':'Unassigned','Total Deals':unassigned.length,'Pipeline Value (RM)':unassigned.reduce((acc,d)=>acc+Number(d.value||0),0),'Won Deals':unassigned.filter(d=>wonIds.includes(d.stage)).length,'Won Value (RM)':unassigned.filter(d=>wonIds.includes(d.stage)).reduce((acc,d)=>acc+Number(d.value||0),0),'Open Deals':unassigned.filter(d=>!wonIds.includes(d.stage)).length});}

  // Industry summary
  const indRows=inds.map(ind=>{
    const iDeals=filteredDeals.filter(d=>d.industry===ind);
    const wonD=iDeals.filter(d=>wonIds.includes(d.stage));
    return{'Industry':ind,'Total Deals':iDeals.length,'Pipeline Value (RM)':iDeals.reduce((s,d)=>s+Number(d.value||0),0),'Won Deals':wonD.length,'Won Value (RM)':wonD.reduce((s,d)=>s+Number(d.value||0),0)};
  });

  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(dealRows.length?dealRows:[{'Info':'No data for selected industries'}]);
  const ws2=XLSX.utils.json_to_sheet(stageRows);
  const ws3=XLSX.utils.json_to_sheet(spRows.length?spRows:[{'Info':'No salesperson data'}]);
  const ws4=XLSX.utils.json_to_sheet(indRows.length?indRows:[{'Info':'No industry data'}]);
  ws1['!cols']=[{wch:28},{wch:22},{wch:22},{wch:16},{wch:16},{wch:14},{wch:20},{wch:14},{wch:40}];
  ws2['!cols']=[{wch:20},{wch:16},{wch:18}];
  ws3['!cols']=[{wch:22},{wch:14},{wch:20},{wch:12},{wch:16},{wch:12}];
  ws4['!cols']=[{wch:18},{wch:12},{wch:20},{wch:12},{wch:16}];
  styleHeader(ws1,dealRows[0]?Object.keys(dealRows[0]):[]);
  styleHeader(ws2,Object.keys(stageRows[0]));
  if(spRows[0])styleHeader(ws3,Object.keys(spRows[0]));
  if(indRows[0])styleHeader(ws4,Object.keys(indRows[0]));
  XLSX.utils.book_append_sheet(wb,ws1,'All Deals');
  XLSX.utils.book_append_sheet(wb,ws2,'Pipeline by Stage');
  XLSX.utils.book_append_sheet(wb,ws3,'By Salesperson');
  XLSX.utils.book_append_sheet(wb,ws4,'By Industry');
  const label=inds.length===INDUSTRIES.length?'all':inds.join('-').toLowerCase().replace(/\s+/g,'_');
  dlXlsx(wb,`pipeline_${label}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function styleHeader(ws, keys){
  if(!keys||!keys.length)return;
  keys.forEach((k,i)=>{
    const cellRef=XLSX.utils.encode_cell({r:0,c:i});
    if(ws[cellRef]){ws[cellRef].s={font:{bold:true},fill:{fgColor:{rgb:'E6F1FB'}},alignment:{horizontal:'center'}};}
  });
}

init();
</script>
